# v4l2loopback configuration for BigCam.
#
# Fallback only.  When v4l2loopback-ctl is available BigCam loads the module
# with devices=0 and creates devices on demand; these options apply when the
# module is loaded by something else (e.g. at boot, or by a distro default).
#
# The device pool below MUST stay in sync with:
#   * usr/share/biglinux/bigcam/script/bigcam-v4l2loopback  (DEVICE_BASE/MAX_DEVICES)
#   * usr/share/biglinux/bigcam/core/virtual_camera.py      (DEVICE_BASE/DEVICE_POOL_SIZE)
#
# Parameters:
#   devices=8             - size of the pool (one device per camera)
#   video_nr=20..27       - /dev/video20-27, above any physical camera
#   exclusive_caps=1,...  - required for browsers/WebRTC to list the devices
#   max_buffers=8         - absorbs USB timing jitter
#   card_label            - friendly name shown in other applications
#
options v4l2loopback devices=8 exclusive_caps=1,1,1,1,1,1,1,1 max_buffers=8 video_nr=20,21,22,23,24,25,26,27 card_label="BigCam Virtual 1,BigCam Virtual 2,BigCam Virtual 3,BigCam Virtual 4,BigCam Virtual 5,BigCam Virtual 6,BigCam Virtual 7,BigCam Virtual 8"
