name: GTK and media integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/audit-hardening-20260907']
permissions:
  contents: read
concurrency:
  group: gtk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'ubuntu:24.04']
    container:
      image: ${{ matrix.image }}
      options: --shm-size=256m
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install distro Python and matching GI runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pytest python3-hypothesis python3-cryptography python3-gi python3-gi-cairo python3-numpy python3-opencv python3-pil python3-aiohttp python3-qrcode python3-pyatspi python3-dogtail python3-polib gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav ffmpeg openssl dbus-x11 xvfb xauth openbox at-spi2-core xdotool scrot pulseaudio pulseaudio-utils adwaita-icon-theme fonts-dejavu-core xdg-user-dirs xdg-utils procps psmisc util-linux gettext libgl1-mesa-dri
          if apt-cache show gstreamer1.0-gtk4 >/dev/null 2>&1; then apt-get install -y --no-install-recommends gstreamer1.0-gtk4; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pure regression tests and syntax
        run: |
          /usr/bin/python3 -m compileall -q usr/share/biglinux/bigcam tests
          /usr/bin/python3 -m pytest -q tests/audit
          bash -n tests/integration/session.sh
      - name: Actual GUI, AT-SPI, capture, recording and error handling
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --uid 10001 --user-group bigcam-test
          mkdir -p /tmp/bigcam-results
          chown bigcam-test:bigcam-test /tmp/bigcam-results
          chmod -R a+rX "$GITHUB_WORKSPACE"
          timeout --kill-after=10s 180s runuser -u bigcam-test -- env BIGCAM_TEST_RESULTS=/tmp/bigcam-results bash tests/integration/session.sh 2>&1 | tee /tmp/bigcam-results/session.log
      - name: Preserve evidence even when a test fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphical-${{ strategy.job-index }}-${{ github.sha }}
          path: /tmp/bigcam-results/
          if-no-files-found: warn
          retention-days: 14
