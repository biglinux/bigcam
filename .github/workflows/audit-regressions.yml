name: Audit regression diagnostics

on:
  push:
    branches: ['fix/audit-hardening-20260907']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record revision and syntax diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bigcam-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/bigcam-audit/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/bigcam-audit/source.tar.gz" HEAD
          python3 -m compileall -q usr/share/biglinux/bigcam
      - name: Preserve exact public source for reproducible diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bigcam-audit-source-${{ github.sha }}
          path: ${{ runner.temp }}/bigcam-audit/
          if-no-files-found: error
          retention-days: 7
