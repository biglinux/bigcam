name: Catalog validation and explicit build dispatch
on:
  pull_request:
    branches: [main]
    paths: ['locale/**', 'usr/share/biglinux/bigcam/**', '.github/workflows/translate-and-build-package.yml']
  push:
    branches: [main]
    paths: ['locale/**']
  workflow_dispatch:
    inputs:
      dispatch_build:
        type: boolean
        description: Dispatch the reviewed main revision to BigLinux package builders
        required: true
        default: false
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - name: Validate catalogs without translation-service secrets or repository writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalogs"
          for po in locale/*.po; do
            msgfmt --check --check-format -o "$RUNNER_TEMP/catalogs/$(basename "${po%.po}").mo" "$po"
          done
  dispatch:
    needs: catalogs
    if: github.event_name == 'workflow_dispatch' && inputs.dispatch_build && github.ref == 'refs/heads/main' && github.repository == 'biglinux/bigcam'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: package-release
    steps:
      - name: Dispatch fixed revision; never execute repository code with this credential
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_TOKEN"
          body=$(python3 -c 'import json,os; print(json.dumps({"event_type":"biglinux/bigcam","client_payload":{"branch":os.environ["REVISION"],"url":"https://github.com/biglinux/bigcam"}}))')
          for repository in build-package build-package-ARM; do
            curl --fail-with-body --silent --show-error --max-time 30 -X POST \
              -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $WEBHOOK_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' --data "$body" \
              "https://api.github.com/repos/BigLinux-Package-Build/$repository/dispatches"
          done
