[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    hardware: requires real camera/audio hardware (deselect with -m "not hardware")
    slow: takes more than a couple of seconds
    gtk: needs a GTK display (runs under xvfb-run)
filterwarnings =
    ignore::DeprecationWarning:gi.*
